openapi: 3.0.0
info:
  title: AOI API
  version: 1.0.0
  description: API for retrieving AOI daily data
servers:
  - url: http://localhost:3000
paths:
  /aoidaily/{startDate}/{endDate}:
    get:
      summary: Retrieve AOI daily data
      parameters:
        - in: path
          name: startDate
          required: true
          schema:
            type: integer
            format: int64
          description: Start date as a timestamp
        - in: path
          name: endDate
          required: true
          schema:
            type: integer
            format: int64
          description: End date as a timestamp
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                  time:
                    type: integer
        '400':
          description: Missing parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  time:
                    type: integer
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  time:
                    type: integer 