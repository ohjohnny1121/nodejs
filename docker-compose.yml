version: '3'
services:
  
  mysql:
    image: mysql:8.0
    command: 
      - --default-authentication-plugin=mysql_native_password 
      - --init-file=/docker-entrypoint-initdb.d/init.sql
      - --max-connections=500
      - --wait-timeout=60
      - --interactive-timeout=60
    environment:
      MYSQL_ROOT_PASSWORD: pwd123
      MYSQL_USER: user
      MYSQL_PASSWORD: pwd123

    volumes:
      - /d/sn-mysql:/var/lib/mysql  # 本地 SSD 位置
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network
    ports:
      - "3306:3306"
    restart: always

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      # 既有的 MySQL 配置保持不變
      - MYSQL_HOST=mysql
      - MYSQL_USER=user
      - MYSQL_PASSWORD=pwd123
      # 新增 MSSQL 配置
      - MSSQL_HOST=UTCSNACMLSNR
      - MSSQL_USER=dc_read
      - MSSQL_PASSWORD=ewFJ9%(4
      - MSSQL_DATABASE=acme
    depends_on:
      - mysql
    networks:
      - app-network
    restart: always

  phpmyadmin:
    image: phpmyadmin:latest
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: pwd123
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - app-network
    restart: always

volumes:
  mysql-data:  # 用於將 MySQL 資料存放於 SSD 的位置

networks:
  app-network: