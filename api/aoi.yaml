openapi: 3.0.0
info:
  title: AOI API
  version: 1.0.0
  description: API for retrieving AOI daily data
servers:
  - url: http://WYM2DNA4378:3000
    description: 本地服務器
  - url: http://10.22.94.69:3000
    description: 內部網絡服務器
paths:
  /aoi/aoidaily/{startDate}/{endDate}/{factory}:
    get:
      summary: Retrieve AOI daily data
      parameters:
        - in: path
          name: startDate
          required: true
          schema:
            type: integer
            format: int64
          description: Start date as a timestamp
        - in: path
          name: endDate
          required: true
          schema:
            type: integer
            format: int64
          description: End date as a timestamp
        - in: path
          name: factory
          required: true
          schema:
            type: string
          description: Factory identifier
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                  time:
                    type: string
                    format: date-time
        '400':
          description: Missing parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  time:
                    type: string
                    format: date-time
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  time:
                    type: string
                    format: date-time 