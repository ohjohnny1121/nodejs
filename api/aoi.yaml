openapi: 3.0.0
info:
  title: AOI API
  version: 1.0.0
  description: API for retrieving AOI daily data and images
servers:
  - url: http://10.22.94.69:3000
    description: 內部網絡服務器
  - url: http://WYM2DNA4378:3000
    description: 本地服務器
paths:
  /aoi/aoidaily/{startDate}/{endDate}/{factory}:
    get:
      summary: Retrieve AOI daily data
      parameters:
        - in: path
          name: startDate
          required: true
          schema:
            type: integer
            format: int64
          description: Start date as a timestamp
        - in: path
          name: endDate
          required: true
          schema:
            type: integer
            format: int64
          description: End date as a timestamp
        - in: path
          name: factory
          required: true
          schema:
            type: string
          description: Factory identifier
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                  time:
                    type: string
                    format: date-time
        '400':
          description: Missing parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  time:
                    type: string
                    format: date-time
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  time:
                    type: string
                    format: date-time
  /aoi/image:
    get:
      summary: Retrieve image in base64 format
      parameters:
        - in: query
          name: ImagePath
          required: true
          schema:
            type: string
          description: Path to the image
        - in: query
          name: DefectSeq
          required: true
          schema:
            type: string
          description: Defect sequence number
        - in: query
          name: BoardNo
          required: true
          schema:
            type: string
          description: Board number
        - in: query
          name: Side
          required: true
          schema:
            type: string
          description: Side of the board
        - in: query
          name: xValue
          required: true
          schema:
            type: number
          description: X coordinate value
        - in: query
          name: yValue
          required: true
          schema:
            type: number
          description: Y coordinate value
        - in: query
          name: factory
          required: true
          schema:
            type: string
          description: Factory identifier
      responses:
        '200':
          description: Image retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  image:
                    type: string
                    description: Base64 encoded image
        '500':
          description: Error retrieving image
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  image:
                    type: string
  /aoi/aoi-revise-remark:
    post:
      summary: Update AOI remark
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lotnum:
                  type: string
                  description: Lot number to update
                remark:
                  type: string
                  description: New remark for the lot number
      responses:
        '200':
          description: Remark updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  time:
                    type: string
                    format: date-time
      responses:
        '200':
          description: Remark updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  time:
                    type: string
                    format: date-time
        '500':
          description: Error updating remark
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  time:
                    type: string
                    format: date-time
  /aoi/history/{lot}:
    get:
      summary: Retrieve history data for a specific lot
      parameters:
        - in: path
          name: lot
          required: true
          schema:
            type: string
          description: Lot number to retrieve history for
      responses:
        '200':
          description: History data retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        Lot:
                          type: string
                          description: The lot number
                        Layer:
                          type: string
                          description: The layer name
                        Process:
                          type: string
                          description: The process name
                        Machine:
                          type: string
                          description: The machine name
                        ProcessTime:
                          type: string
                          format: date-time
                          description: The time of the process
                        DetailProcess:
                          type: string
                          description: Detailed process information
                  time:
                    type: string
                    format: date-time
        '500':
          description: Error retrieving history data
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  time:
                    type: string
                    format: date-time
  /aoi/lot-list/{uid}:
    get:
      summary: 取得用戶的 lot 列表
      parameters:
        - in: path
          name: uid
          required: true
          schema:
            type: string
          description: 用戶 ID
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        factory:
                          type: string
                          description: 廠別
                        part_no:
                          type: string
                          description: 料號
                        lot_num:
                          type: string
                          description: 批號
                        layer:
                          type: string
                          description: 層別
                  time:
                    type: string
                    format: date-time
        '500':
          description: 操作失敗
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  time:
                    type: string
                    format: date-time

    post:
      summary: 新增或更新用戶的 lot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                uid:
                  type: string
                  description: 工號
                lot_list:
                  type: array
                  items:
                    type: object
                    properties:
                      factory:
                        type: string
                        description: 廠別
                      part_no:
                        type: string
                        description: 料號
                      lot_num:
                        type: string
                        description: 批號
                      layer:
                        type: string
                  description: 層別
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  data:
                    type: object
                  time:
                    type: string
                    format: date-time
        '500':
          description: 操作失敗
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  time:
                    type: string
                    format: date-time

    delete:
      summary: 刪除用戶的特定 lot、layer
      parameters:
        - in: query
          name: uid
          required: true
          schema:
            type: string
          description: 工號
        - in: query
          name: factory
          required: true
          schema:
            type: string
          description: 廠別
        - in: query
          name: part_no
          required: true
          schema:
            type: string
          description: 料號
        - in: query
          name: lot_num
          required: true
          schema:
            type: string
          description: 批號
        - in: query
          name: layer
          required: true
          schema:
            type: string
          description: 層別
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  data:
                    type: object
                  time:
                    type: string
                    format: date-time
        '500':
          description: 操作失敗
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  time:
                    type: string
                    format: date-time

  /aoi/lot-list-all:
    delete:
      summary: 刪除用戶的所有 lot
      parameters:
        - in: query
          name: uid
          required: true
          schema:
            type: string
          description: 用戶 ID
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  data:
                    type: object
                  time:
                    type: string
                    format: date-time
        '500':
          description: 操作失敗
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  time:
                    type: string
                    format: date-time 