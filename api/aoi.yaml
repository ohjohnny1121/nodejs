openapi: 3.0.0
info:
  title: AOI API
  version: 1.0.0
  description: API for managing AOI data
servers:
  - url: http://10.22.94.69:3000
    description: 內部網絡服務器
  - url: http://WYM2DNA4378:3000
    description: 本地服務器
tags:
  - name: Lot Management
    description: Operations related to lot management
  - name: AOI Data
    description: Operations related to AOI data retrieval
  - name: Image Retrieval
    description: Operations related to image retrieval
  - name: NCN
    description: Operations related to NCN
paths:
  /aoi/lot-list/{factory}/{lot_num}/{layer}:
    get:
      tags:
        - Lot Management
      summary: Retrieve lot list for a specific lot
      parameters:
        - in: path
          name: factory
          required: true
          schema:
            type: string
          description: Factory identifier
        - in: path
          name: lot_num
          required: true
          schema:
            type: string
          description: Lot number
        - in: path
          name: layer
          required: true
          schema:
            type: string
          description: Layer
      responses:
        '200':
          description: Lot list retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                  time:
                    type: string
                    format: date-time
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  time:
                    type: string
                    format: date-time
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  time:
                    type: string
                    format: date-time
        '500':
          description: Error retrieving lot list
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string

  /aoi/lot-list/{uid}:
    get:
      tags:
        - Lot Management
      summary: Retrieve lot list for a specific user
      parameters:
        - in: path
          name: uid
          required: true
          schema:
            type: string
          description: User identifier
      responses:
        '200':
          description: Lot list retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                  time:
                    type: string
                    format: date-time
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        '500':
          description: Error retrieving lot list
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  time:
                    type: string
                    format: date-time

  /aoi/lot-list:
    post:
      tags:
        - Lot Management
      summary: Add or update lot list for a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                uid:
                  type: string
                  description: User identifier
                lot_list:
                  type: array
                  items:
                    type: object
                    properties:
                      factory:
                        type: string
                      part_no:
                        type: string
                      lot_num:
                        type: string
                      layer:
                        type: string
      responses:
        '200':
          description: Lot list updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                  time:
                    type: string
                    format: date-time
        '500':
          description: Error updating lot list
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  time:
                    type: string
                    format: date-time

    delete:
      tags:
        - Lot Management
      summary: Delete a specific lot from the user's lot list
      parameters:
        - in: query
          name: uid
          required: true
          schema:
            type: string
          description: User identifier
        - in: query
          name: factory
          required: true
          schema:
            type: string
          description: Factory identifier
        - in: query
          name: part_no
          required: true
          schema:
            type: string
          description: Part number
        - in: query
          name: lot_num
          required: true
          schema:
            type: string
          description: Lot number
        - in: query
          name: layer
          required: true
          schema:
            type: string
          description: Layer
      responses:
        '200':
          description: Lot deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                  time:
                    type: string
                    format: date-time
        '500':
          description: Error deleting lot
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  time:
                    type: string
                    format: date-time

  /aoi/lot-list-all:
    delete:
      tags:
        - Lot Management
      summary: Delete all lots for a specific user
      parameters:
        - in: query
          name: uid
          required: true
          schema:
            type: string
          description: User identifier
      responses:
        '200':
          description: All lots deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                  time:
                    type: string
                    format: date-time
        '500':
          description: Error deleting all lots
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  time:
                    type: string
                    format: date-time

  /aoi/aoi-revise-remark:
    post:
      tags:
        - AOI Data
      summary: Update remark for a specific lot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lot_num:
                  type: string
                  description: Lot number
                remark:
                  type: string
                  description: Remark to be updated
      responses:
        '200':
          description: Remark updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  time:
                    type: string
                    format: date-time
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  time:
                    type: string
                    format: date-time
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  time:
                    type: string
                    format: date-time

  /aoi/history/{lot_num}:
    get:
      tags:
        - AOI Data
      summary: Retrieve history data for a specific lot
      parameters:
        - in: path
          name: lot_num
          required: true
          schema:
            type: string
          description: Lot number
      responses:
        '200':
          description: History data retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                  time:
                    type: string
                    format: date-time
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  time:
                    type: string
                    format: date-time
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  time:
                    type: string
                    format: date-time

  /aoi/aoidaily/{startDate}/{endDate}/{factory}:
    get:
      tags:
        - AOI Data
      summary: Retrieve daily AOI data
      parameters:
        - in: path
          name: startDate
          required: true
          schema:
            type: string
          description: Start date in timestamp format
        - in: path
          name: endDate
          required: true
          schema:
            type: string
          description: End date in timestamp format
        - in: path
          name: factory
          required: true
          schema:
            type: string
          description: Factory identifier
      responses:
        '200':
          description: Daily AOI data retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                  time:
                    type: string
                    format: date-time
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  time:
                    type: string
                    format: date-time

  /aoi/image:
    get:
      tags:
        - Image Retrieval
      summary: Retrieve AOI image
      parameters:
        - in: query
          name: ImagePath
          required: true
          schema:
            type: string
          description: Path to the image
        - in: query
          name: DefectSeq
          required: true
          schema:
            type: string
          description: Defect sequence number
        - in: query
          name: BoardNo
          required: true
          schema:
            type: string
          description: Board number
        - in: query
          name: Side
          required: true
          schema:
            type: string
          description: Side of the board
        - in: query
          name: xValue
          required: true
          schema:
            type: number
          description: X coordinate value
        - in: query
          name: yValue
          required: true
          schema:
            type: number
          description: Y coordinate value
      responses:
        '200':
          description: Image retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  image:
                    type: string
                    description: Base64 encoded image
                  time:
                    type: string
                    format: date-time
        '500':
          description: Error retrieving image
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  image:
                    type: string

  /aoi/mapping/{lot_num}/{layer}/{isincludefake}:
    get:
      tags:
        - AOI Mapping
      summary: Retrieve mapping data for a specific lot and layer
      parameters:
        - in: path
          name: lot_num
          required: true
          schema:
            type: string
          description: Lot number
        - in: path
          name: layer
          required: true
          schema:
            type: string
          description: Layer name
        - in: path
          name: isincludefake
          required: true
          schema:
            type: string
          description: Include fake data
      responses:
        '200':
          description: Mapping data retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '500':
          description: Error retrieving mapping data
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  time:
                    type: string
                    format: date-time

  /aoi/layout/{lot_num}/{layer}:
    get:
      tags:
        - AOI Mapping
      summary: Retrieve layout data for a specific lot and layer
      parameters:
        - in: path
          name: lot_num
          required: true
          schema:
            type: string
          description: Lot number
        - in: path
          name: layer
          required: true
          schema:
            type: string
          description: Layer name
      responses:
        '200':
          description: Layout data retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  dataAry:
                    type: array
                    items:
                      type: array
                      items:
                        type: object
                        properties:
                          x:
                            type: number
                          y:
                            type: number
                  headdata:
                    type: array
                    items:
                      type: object
        '500':
          description: Error retrieving layout data
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  time:
                    type: string
                    format: date-time

  /aoi/ncnrecord/{lot_num}:
    get:
      tags:
        - NCN
      summary: Retrieve NCN record for a specific lot
      parameters:
        - in: path
          name: lot_num
          required: true
          schema:
            type: string
          description: Lot number
      responses:
        '200':
          description: NCN record retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    ncn_no:
                      type: string
                    open_datetime:
                      type: string
                    layer:
                      type: string
                    failure_mode:
                      type: string
                    problem_des:
                      type: string
                    prd_qty:
                      type: number
                    defect_qty:
                      type: number
                    prd_unit:
                      type: string
                    defect_unit:
                      type: string
                    ncn_level:
                      type: string
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        '500':
          description: Error retrieving NCN record
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  time:
                    type: string
                    format: date-time

