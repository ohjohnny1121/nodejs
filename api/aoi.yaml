openapi: 3.0.0
info:
  title: AOI API
  version: 1.0.0
  description: API for managing AOI data
servers:
  - url: http://10.22.94.69:3000
    description: 內部網絡服務器
  - url: http://WYM2DNA4378:3000
    description: 本地服務器
tags:
  - name: Lot Management
    description: Operations related to lot management
  - name: AOI Data
    description: Operations related to AOI data retrieval
  - name: Image Retrieval
    description: Operations related to image retrieval
paths:
  /aoi/lot-list/{uid}:
    get:
      tags:
        - Lot Management
      summary: Retrieve lot list for a specific user
      parameters:
        - in: path
          name: uid
          required: true
          schema:
            type: string
          description: User identifier
      responses:
        '200':
          description: Lot list retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                  time:
                    type: string
                    format: date-time
        '500':
          description: Error retrieving lot list
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  time:
                    type: string
                    format: date-time

  /aoi/lot-list:
    post:
      tags:
        - Lot Management
      summary: Add or update lot list for a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                uid:
                  type: string
                  description: User identifier
                lot_list:
                  type: array
                  items:
                    type: object
                    properties:
                      factory:
                        type: string
                      part_no:
                        type: string
                      lot_num:
                        type: string
                      layer:
                        type: string
      responses:
        '200':
          description: Lot list updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                  time:
                    type: string
                    format: date-time
        '500':
          description: Error updating lot list
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  time:
                    type: string
                    format: date-time

    delete:
      tags:
        - Lot Management
      summary: Delete a specific lot from the user's lot list
      parameters:
        - in: query
          name: uid
          required: true
          schema:
            type: string
          description: User identifier
        - in: query
          name: factory
          required: true
          schema:
            type: string
          description: Factory identifier
        - in: query
          name: part_no
          required: true
          schema:
            type: string
          description: Part number
        - in: query
          name: lot_num
          required: true
          schema:
            type: string
          description: Lot number
        - in: query
          name: layer
          required: true
          schema:
            type: string
          description: Layer
      responses:
        '200':
          description: Lot deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                  time:
                    type: string
                    format: date-time
        '500':
          description: Error deleting lot
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  time:
                    type: string
                    format: date-time

  /aoi/lot-list-all:
    delete:
      tags:
        - Lot Management
      summary: Delete all lots for a specific user
      parameters:
        - in: query
          name: uid
          required: true
          schema:
            type: string
          description: User identifier
      responses:
        '200':
          description: All lots deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                  time:
                    type: string
                    format: date-time
        '500':
          description: Error deleting all lots
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  time:
                    type: string
                    format: date-time

  /aoi/aoi-revise-remark:
    post:
      tags:
        - AOI Data
      summary: Update AOI remark
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lotnum:
                  type: string
                  description: Lot number to update
                remark:
                  type: string
                  description: New remark for the lot number
      responses:
        '200':
          description: Remark updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  time:
                    type: string
                    format: date-time
        '500':
          description: Error updating remark
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  time:
                    type: string
                    format: date-time

  /aoi/history/{lotnum}:
    get:
      tags:
        - AOI Data
      summary: Retrieve history data for a specific lot
      parameters:
        - in: path
          name: lotnum
          required: true
          schema:
            type: string
          description: Lot number to retrieve history for
      responses:
        '200':
          description: History data retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        Lot:
                          type: string
                          description: The lot number
                        Layer:
                          type: string
                          description: The layer name
                        Process:
                          type: string
                          description: The process name
                        Machine:
                          type: string
                          description: The machine name
                        ProcessTime:
                          type: string
                          format: date-time
                          description: The time of the process
                        DetailProcess:
                          type: string
                          description: Detailed process information
                  time:
                    type: string
                    format: date-time
        '500':
          description: Error retrieving history data
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  time:
                    type: string
                    format: date-time

  /aoi/aoidaily/{startDate}/{endDate}/{factory}:
    get:
      tags:
        - AOI Data
      summary: Retrieve AOI daily data
      parameters:
        - in: path
          name: startDate
          required: true
          schema:
            type: integer
            format: int64
          description: Start date as a timestamp
        - in: path
          name: endDate
          required: true
          schema:
            type: integer
            format: int64
          description: End date as a timestamp
        - in: path
          name: factory
          required: true
          schema:
            type: string
          description: Factory identifier
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                  time:
                    type: string
                    format: date-time
        '400':
          description: Missing parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  time:
                    type: string
                    format: date-time
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  time:
                    type: string
                    format: date-time

  /aoi/image:
    get:
      tags:
        - Image Retrieval
      summary: Retrieve image in base64 format
      parameters:
        - in: query
          name: ImagePath
          required: true
          schema:
            type: string
          description: Path to the image
        - in: query
          name: DefectSeq
          required: true
          schema:
            type: string
          description: Defect sequence number
        - in: query
          name: BoardNo
          required: true
          schema:
            type: string
          description: Board number
        - in: query
          name: Side
          required: true
          schema:
            type: string
          description: Side of the board
        - in: query
          name: xValue
          required: true
          schema:
            type: number
          description: X coordinate value
        - in: query
          name: yValue
          required: true
          schema:
            type: number
          description: Y coordinate value
        - in: query
          name: factory
          required: true
          schema:
            type: string
          description: Factory identifier
      responses:
        '200':
          description: Image retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  image:
                    type: string
                    description: Base64 encoded image
        '500':
          description: Error retrieving image
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  image:
                    type: string

  /aoi/mapping/{lot}/{layer}/{isincludefake}:
    get:
      tags:
        - AOI Mapping
      summary: Retrieve mapping data for a specific lot and layer
      parameters:
        - in: path
          name: lot
          required: true
          schema:
            type: string
          description: Lot number
        - in: path
          name: layer
          required: true
          schema:
            type: string
          description: Layer name
        - in: path
          name: isincludefake
          required: true
          schema:
            type: string
          description: Include fake data
      responses:
        '200':
          description: Mapping data retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '500':
          description: Error retrieving mapping data
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  time:
                    type: string
                    format: date-time

  /aoi/layout/{lot}/{layer}:
    get:
      tags:
        - AOI Mapping
      summary: Retrieve layout data for a specific lot and layer
      parameters:
        - in: path
          name: lot
          required: true
          schema:
            type: string
          description: Lot number
        - in: path
          name: layer
          required: true
          schema:
            type: string
          description: Layer name
      responses:
        '200':
          description: Layout data retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  dataAry:
                    type: array
                    items:
                      type: array
                      items:
                        type: object
                        properties:
                          x:
                            type: number
                          y:
                            type: number
                  headdata:
                    type: array
                    items:
                      type: object
        '500':
          description: Error retrieving layout data
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  time:
                    type: string
                    format: date-time