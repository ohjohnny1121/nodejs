  /aoi/trend_data_batch:
    get:
      tags:
        - AOI Trend
      summary: Retrieve batch trend data
      parameters:
        - in: query
          name: itemsArray
          required: true
          schema:
            type: array
            items:
              type: string
              example: |
                {
                  "process": "AOI1VRS1",
                  "part_no": "2231490",
                  "lot_num": "24CT6001-03-00",
                  "layer": "-L5L6",
                  "defect_type": "A1"
                }
          style: form
          explode: true
          description: Array of JSON strings containing trend data parameters
      responses:
        '200':
          description: Batch trend data retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "成功"
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        part_no:
                          type: string
                        lot_num:
                          type: string
                        layer:
                          type: string
                        defect_type:
                          type: string
                        process:
                          type: string
                        data:
                          type: array
                          items:
                            type: object
                            properties:
                              part_no:
                                type: string
                              lot_num:
                                type: string
                              layer_name:
                                type: string
                              lot_type:
                                type: string
                              check_in_time:
                                type: string
                              proc_group:
                                type: string
                              proc_name:
                                type: string
                              MachineName:
                                type: string
                              proc_name_e:
                                type: string
                              SerialNum:
                                type: string
                              defect_rate:
                                type: number
                              defect_code:
                                type: string
                  time:
                    type: string
                    format: date-time
        '400':
          description: Bad request - Invalid input format
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "error"
                  message:
                    type: string
                    example: "輸入格式錯誤"
                  time:
                    type: string
                    format: date-time
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "error"
                  message:
                    type: string
                  time:
                    type: string
                    format: date-time

  /aoi/factory-list:
    get:
      tags:
        - AOI Data
      summary: Retrieve list of factories
      responses:
        '200':
          description: Factory list retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                  time:
                    type: string
                    format: date-time
        '500':
          description: Error retrieving factory list
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  time:
                    type: string
                    format: date-time
  /aoi/process_name:
    post:
      tags:
        - process_name
      summary: Add or update process name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                process_name:
                  type: string
                creator:
                  type: string
      responses:
        '200':
          description: Process name added or updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  time:
                    type: string
                    format: date-time
        '500':
          description: Error adding or updating process name
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  time:
                    type: string
                    format: date-time
    get:
      tags:
        - process_name
      summary: Retrieve process name
      responses:
        '200':
          description: Process name retrieved successfully
          content:
            application/json:
              schema:
                  type: object
                  properties:
                    status:
                      type: string
                    message:
                      type: string
                    data:
                      type: array
                      items:
                        type: object
                        properties:
                          process_name:
                            type: string
                          creator:
                            type: string
                    time:
                      type: string
                      format: date-time
          '500':
            description: Error retrieving process name
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    status:
                      type: string
                    message:
                      type: string
                    time:
                      type: string
                      format: date-time
  /aoi/process_name/{process_name}:
    delete:
      tags:
        - process_name
      summary: Delete process name
      parameters:
        - in: path
          name: process_name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Process name deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  time:
                    type: string
                    format: date-time
        '500':
          description: Error deleting process name
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  time:
                    type: string
                    format: date-time
        '400':
          description: Process name is necessary
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: 'process_name is necessary'
                  time:
                    type: string
                    format: date-time

