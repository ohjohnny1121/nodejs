openapi: 3.0.0
info:
  title: Tartri API
  version: 1.0.0
  description: API for managing AOI specifications and lot lists
servers:
  - url: http://10.22.94.69:3000
    description: 內部網絡服務器
  - url: http://WYM2DNA4378:3000
    description: 本地服務器
paths:
  /tartri/aoi-spec:
    get:
      summary: Retrieve AOI specifications
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "成功"
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        part_no:
                          type: string
                          example: "1234567890"
                        target:
                          type: string
                          example: "1"
                        triger:
                          type: string
                          example: "1"
                        creator:
                          type: string
                          example: "SYSTEM"
                        factory:
                          type: string
                          example: "1"
                  time:
                    type: string
                    format: date-time
        '500':
          description: 操作失敗
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  time:
                    type: string
                    format: date-time
    post:
      summary: Update AOI specification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                part_no:
                  type: string
                target:
                  type: string
                triger:
                  type: string
                factory:
                  type: string
                creator:
                  type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  data:
                    type: object
                  time:
                    type: string
                    format: date-time
        '500':
          description: 操作失敗
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  time:
                    type: string
                    format: date-time
    delete:
      summary: Delete AOI specification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                part_no:
                  type: string
                factory:
                  type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  data:
                    type: object
                  time:
                    type: string
                    format: date-time
        '500':
          description: 操作失敗
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  time:
                    type: string
                    format: date-time
  